<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>战双剧情排行</title>
<meta name="description" content="把《战双帕弥什》的剧情拖成一个你自己的排行榜">
<style>
  :root{
    --bg:#0b0d11; --panel:#151920; --line:#262c36; --text:#e9eef7; --dim:#8b96a8;
    --accent:#ff5a6e; --accent2:#6ad1ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1a2230 0%,var(--bg) 55%) fixed;
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;padding-bottom:0
  }
  header{
    position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
    background:rgba(11,13,17,.82);border-bottom:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-top)) 14px
  }
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.4px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .searchrow{display:flex;gap:8px;margin-top:10px}
  #q{
    flex:1;width:auto;margin:0;padding:10px 12px;font:inherit;font-size:14px;
    background:#10141b;color:var(--text);border:1px solid var(--line);border-radius:11px;outline:none
  }
  #q:focus{border-color:var(--accent2)}
  #nextHit,#shuffle{padding:10px 14px;font-size:14px;flex:none;white-space:nowrap}
  .modes{display:flex;gap:8px;margin-top:10px}
  .modes button{flex:1;padding:9px;font-size:13px;border-radius:10px;background:#10141b}
  .modes button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .community{display:flex;gap:8px;margin-top:8px}
  .community button{flex:1;padding:9px;font-size:13px;border-radius:10px;background:#10141b}
  #globalList{max-height:52vh;overflow:auto}
  .grow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
  .grow b{width:28px;text-align:right;color:var(--accent2);font-variant-numeric:tabular-nums}
  .grow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow em{color:var(--dim);font-style:normal;font-size:12px}
  #cmpPanel{padding:12px;display:none}
  #cmpPanel.show{display:block}
  .cmp-progress{color:var(--dim);font-size:12px;text-align:center;margin-bottom:10px}
  .cmp-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .cmp-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
  .cmp-card:active{transform:scale(.98);border-color:var(--accent)}
  .cmp-card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000;max-height:42vh}
  .cmp-card .t{padding:8px 10px;font-size:13px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp-actions{display:flex;gap:8px;margin-top:12px}
  .cmp-actions2{display:flex;gap:8px;margin-top:8px}
  .cmp-actions2 button{flex:1;font-size:12px;padding:8px;background:#10141b}
  #lightDlg textarea{width:100%;margin-top:10px;background:#0a0d11;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;min-height:64px;resize:vertical}
  .item .cm{display:none}
  .item.has-cm .cm{display:block;font-size:11px;color:var(--accent2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmp-actions button{flex:1}
  #lightDlg .dlg-b{padding:8px;max-height:72vh;overflow:auto}
  #lightImg{width:100%;border-radius:10px;display:block}
  .item.hit{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
  .item.hit .name{color:#9fe0ff;font-weight:700}
  button{
    font:inherit;font-size:13px;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:9px 13px;cursor:pointer
  }
  button:active{transform:scale(.97)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  #list{list-style:none;margin:0;padding:12px 12px calc(66px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
  .item{
    display:flex;align-items:center;gap:10px;padding:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;touch-action:pan-y
  }
  .item.dragging{position:fixed;z-index:80;pointer-events:none;border-color:var(--accent);
    box-shadow:0 14px 34px rgba(0,0,0,.6);opacity:.96}
  .rank{width:28px;text-align:center;font-weight:800;font-size:14px;color:var(--accent2);
    font-variant-numeric:tabular-nums;flex:none}
  .thumb{width:96px;height:54px;border-radius:9px;object-fit:cover;background:#000;flex:none}
  .name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .handle{flex:none;width:34px;height:54px;display:grid;place-items:center;color:var(--dim);
    font-size:17px;cursor:grab;touch-action:none;letter-spacing:-2px}
  .empty{margin:48px 18px;padding:34px 18px;text-align:center;color:var(--dim);
    border:1px dashed var(--line);border-radius:16px;line-height:1.9;font-size:13px}
  footer{
    position:fixed;left:50%;transform:translateX(-50%);max-width:900px;width:100%;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    background:rgba(11,13,17,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:8px
  }
  footer button{flex:1}
  dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:16px;max-width:560px;width:calc(100% - 32px);padding:0}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  .dlg-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
  .dlg-b{padding:12px 16px}
  textarea{width:100%;height:46vh;background:#0a0d11;color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .dlg-f{padding:0 16px 14px;display:flex;gap:8px}
  #imgDlg .dlg-b{padding:10px 12px;max-height:62vh;overflow:auto}
  #imgDlg img{width:100%;border-radius:10px;display:block}
  .dlg-f button{flex:1}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
    background:#fff;color:#111;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:.2s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 桌面端 ---------- */
  @media (min-width:900px){
    body{
      max-width:900px;margin:0 auto;
      box-shadow:0 0 90px rgba(0,0,0,.65);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
    }
    header{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:16px}
    h1{font-size:22px}
    .sub{font-size:13px}
    .modes button{padding:10px;font-size:14px}
    #q{font-size:15px}
    #list{gap:10px;padding:16px 16px calc(74px + env(safe-area-inset-bottom))}
    .item{padding:10px;border-radius:16px;transition:border-color .15s,transform .15s,box-shadow .15s}
    .item:hover{border-color:rgba(124,196,255,.45);transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
    .thumb{width:124px;height:70px}
    .name{font-size:15px}
    .rank{font-size:15px;width:32px}
    .handle{height:70px;font-size:19px}
    .cmp-card img{max-height:52vh}
  }

  /* ---------- 视觉打磨 ---------- */
  body{
    background-color:#0b0d11;
    background-image:
      linear-gradient(180deg, rgba(9,11,15,.66) 0%, rgba(9,11,15,.76) 55%, rgba(9,11,15,.86) 100%),
      url("bg.jpg");
    background-position:center top, center top;
    background-size:cover, cover;
    background-repeat:no-repeat, no-repeat;
    background-attachment:scroll, scroll;
  }
  @media (min-width:900px){
    body{ background-attachment:fixed, fixed; }
  }
  header{
    background:linear-gradient(180deg, rgba(22,27,36,.96), rgba(11,13,17,.88));
    backdrop-filter:blur(18px) saturate(1.1);
    border-bottom:1px solid rgba(255,255,255,.07);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  h1{
    background:linear-gradient(90deg,#fff,#ffd0d8 45%,#9fe0ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.6px;
  }
  button{
    background:linear-gradient(180deg,#1b212b,#151a22);
    border:1px solid rgba(255,255,255,.09);
    transition:transform .12s, box-shadow .18s, border-color .18s;
  }
  button:hover{border-color:rgba(124,196,255,.45);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  button.primary{
    background:linear-gradient(180deg,#ff6b7d,#e84a60);
    border-color:rgba(255,255,255,.18);
    box-shadow:0 8px 20px rgba(255,90,110,.28);
  }
  .item{
    background:linear-gradient(180deg,rgba(24,29,38,.92),rgba(20,25,34,.94));
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .rank{
    font-variant-numeric:tabular-nums;
    border-radius:8px;
    padding:2px 0;
  }
  .item:nth-child(1) .rank{color:#1b1408;background:linear-gradient(180deg,#ffe08a,#f5b942);font-weight:900}
  .item:nth-child(2) .rank{color:#0f1318;background:linear-gradient(180deg,#e6edf5,#b9c6d6);font-weight:900}
  .item:nth-child(3) .rank{color:#1a1008;background:linear-gradient(180deg,#f0b98a,#c98a5a);font-weight:900}
  .thumb{box-shadow:0 4px 14px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.07)}
  footer{
    background:linear-gradient(180deg, rgba(11,13,17,.75), rgba(11,13,17,.96));
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.07);
  }

  .tierA{background:linear-gradient(180deg,#ff6b7d,#e84a60)!important;color:#fff!important;font-weight:800;border-color:rgba(255,255,255,.2)!important;box-shadow:0 8px 20px rgba(255,90,110,.25)}
  .tierB{background:linear-gradient(180deg,#4f8fd6,#3a6fb5)!important;color:#fff!important;font-weight:800;border-color:rgba(255,255,255,.16)!important;box-shadow:0 8px 20px rgba(79,143,214,.22)}
  .tierC{background:linear-gradient(180deg,#3d4453,#2b313c)!important;color:#cfd6e2!important;font-weight:700;border-color:rgba(255,255,255,.12)!important}

  h1{text-align:center}
  .tagline{
    text-align:center;font-size:12px;color:#7d8899;letter-spacing:.16em;
    margin:6px 0 2px;text-shadow:0 0 18px rgba(124,196,255,.18)
  }

  #tourPanel{padding:12px;display:none}
  #tourPanel.show{display:block}

  #bracketDlg{max-width:96vw;width:96vw}
  #bracketDlg .dlg-b{max-height:74vh;overflow:auto;padding:8px}
  #bracketDlg img{width:100%;height:auto;border-radius:10px;display:block}
</style>
</head>
<body>
<header>
  <h1>战双<span>剧情</span>排行</h1>
  <div class="tagline">愿每一位重返家园的人类之子，平安</div>
  <div class="sub" id="sub">按住右侧 ⋮⋮ 上下拖动，排出你心里的顺序</div>
  <div class="modes">
    <button id="modeDrag" class="on" type="button">拖拽排序</button>
    <button id="modeCmp" type="button">两两对比</button>
    <button id="modeTour" type="button">选冠军</button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="搜索章节名" autocomplete="off">
    <button id="nextHit" type="button">下一个</button>
    <button id="shuffle" type="button">打乱</button>
  </div>
</header>

<div id="cmpPanel">
  <div class="cmp-progress" id="cmpProgress">—</div>
  <div class="cmp-grid">
    <div class="cmp-card" id="cardA"><img id="imgA" alt=""><div class="t" id="nameA"></div></div>
  </div>
  <div class="cmp-actions">
    <button id="tier1" class="tierA">喜欢</button>
    <button id="tier2" class="tierB">一般</button>
    <button id="tier3" class="tierC">没感觉</button>
  </div>
  <div class="cmp-actions2">
    <button id="undoCmp">← 返回上一张</button>
    <button id="skipCmp">跳过</button>
  </div>
</div>

<div id="tourPanel">
  <div class="cmp-progress" id="tourProgress">—</div>
  <div class="cmp-grid">
    <div class="cmp-card" id="tCardA"><img id="tImgA" alt=""><div class="t" id="tNameA"></div></div>
    <div class="cmp-card" id="tCardB"><img id="tImgB" alt=""><div class="t" id="tNameB"></div></div>
  </div>
  <div class="cmp-actions2">
    <button id="tQuit">退出比赛</button>
    <button id="tSkip">这局跳过</button>
  </div>
</div>

<ul id="list"></ul>
<div id="empty" class="empty" hidden>正在读取图鉴…</div>

<footer>
  <button id="exportBtn" class="primary">导出排名</button>
  <button id="imgBtn">导出长图</button>
  <button id="resetBtn">恢复默认</button>
</footer>

<dialog id="dlg">
  <div class="dlg-h">复制这份排名发给他</div>
  <div class="dlg-b"><textarea id="out" readonly></textarea></div>
  <div class="dlg-f">
    <button id="copyBtn" class="primary">复制</button>
    <button id="closeDlg">关闭</button>
  </div>
</dialog>

<dialog id="lightDlg">
  <div class="dlg-h" id="lightTitle">查看大图</div>
  <div class="dlg-b">
    <img id="lightImg" alt="">
    <textarea id="cmtBox" placeholder="写一句短评（会出现在导出的长图里）"></textarea>
  </div>
  <div class="dlg-f"><button id="lightClose" class="primary">保存并关闭</button></div>
</dialog>

<dialog id="bracketDlg">
  <div class="dlg-h" id="bracketTitle">赛程图</div>
  <div class="dlg-b"><img id="bracketImg" alt="赛程图"></div>
  <div class="dlg-f">
    <a id="bracketSave" download="战双剧情排行-赛程.jpg" style="flex:1;text-align:center;padding:9px 13px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;font-size:13px">保存图片</a>
    <button id="bracketClose">关闭</button>
  </div>
</dialog>

<dialog id="imgDlg">
  <div class="dlg-h" id="imgTitle">长图已生成</div>
  <div class="dlg-b"><img id="imgPreview" alt="排行榜长图"></div>
  <div class="dlg-f">
    <a id="imgSave" class="btn" download="战双剧情排行.jpg" style="flex:1;text-align:center;padding:9px 13px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;font-size:13px">保存图片</a>
    <button id="imgClose">关闭</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var ORDER_KEY = "pgr-login-rank.v1";
  var listEl = document.getElementById("list");
  var emptyEl = document.getElementById("empty");
  var subEl = document.getElementById("sub");
  var toastEl = document.getElementById("toast");
  var items = [];
  var query = "";
  var COMMENTS_KEY = "pgr-comments.v1";
  var comments = {};
  try{ comments = JSON.parse(localStorage.getItem(COMMENTS_KEY) || "{}") || {}; }catch(e){ comments = {}; }
  var toastTimer = 0;

  function toast(m){
    toastEl.textContent = m; toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1500);
  }

  function render(){
    listEl.innerHTML = "";
    items.forEach(function(it, i){
      var li = document.createElement("li");
      li.className = "item";
      li.dataset.id = it.id;

      var r = document.createElement("div"); r.className = "rank"; r.textContent = String(i + 1);
      var img = document.createElement("img"); img.className = "thumb"; img.src = it.thumb || it.src; img.alt = it.name; img.loading = "lazy";
      var n = document.createElement("div"); n.className = "name"; n.textContent = it.name;
      var wrap = document.createElement("div");
      wrap.style.flex = "1";
      wrap.style.minWidth = "0";
      wrap.appendChild(n);
      var cm = comments[it.id];
      if(cm){
        li.classList.add("has-cm");
        var cmEl = document.createElement("div");
        cmEl.className = "cm";
        cmEl.textContent = "“" + cm + "”";
        wrap.appendChild(cmEl);
      }
      var h = document.createElement("div"); h.className = "handle"; h.textContent = "⋮⋮";

      li.appendChild(r); li.appendChild(img); li.appendChild(wrap); li.appendChild(h);
      listEl.appendChild(li);
    });
    subEl.textContent = items.length + " 张剧情 · 按住 ⋮⋮ 上下拖动";
    applyHighlight();
  }

  function renumber(){
    for(var i = 0; i < listEl.children.length; i++){
      var r = listEl.children[i].querySelector(".rank");
      if(r) r.textContent = String(i + 1);
    }
  }

  function saveOrder(){
    try{
      localStorage.setItem(ORDER_KEY, JSON.stringify(items.map(function(x){ return x.id; })));
    }catch(e){}
  }

  function applySavedOrder(){
    var raw = null;
    try{ raw = localStorage.getItem(ORDER_KEY); }catch(e){}
    if(!raw) return;
    try{
      var ids = JSON.parse(raw);
      if(!Array.isArray(ids)) return;
      var byId = {};
      items.forEach(function(it){ byId[it.id] = it; });
      var ordered = [];
      ids.forEach(function(id){ if(byId[id]){ ordered.push(byId[id]); delete byId[id]; } });
      items.forEach(function(it){ if(byId[it.id]) ordered.push(it); });
      if(ordered.length === items.length) items = ordered;
    }catch(e){}
  }

  /* ---------- 拖动 ---------- */
  var drag = null;

  function onDown(ev){
    var h = ev.target.closest ? ev.target.closest(".handle") : null;
    if(!h) return;
    var li = h.closest(".item");
    if(!li) return;
    ev.preventDefault();

    var rect = li.getBoundingClientRect();
    var ghost = li.cloneNode(true);
    ghost.classList.add("dragging");
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.margin = "0";
    document.body.appendChild(ghost);
    li.style.opacity = ".22";

    drag = { el: li, ghost: ghost, grab: ev.clientY - rect.top, dir: 0, speed: 0, raf: 0 };
    document.addEventListener("pointermove", onMove, { passive:false });
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function autoScrollTick(){
    if(!drag){ return; }
    if(drag.dir !== 0){ window.scrollBy(0, drag.dir * drag.speed); }
    drag.raf = requestAnimationFrame(autoScrollTick);
  }

  function onMove(ev){
    if(!drag) return;
    ev.preventDefault();
    drag.ghost.style.top = (ev.clientY - drag.grab) + "px";

    // 拖到屏幕上下边缘时自动滚动
    var EDGE = 96, MAX = 20, vh = window.innerHeight;
    if(ev.clientY < EDGE){
      drag.dir = -1;
      drag.speed = Math.max(3, Math.round((EDGE - ev.clientY) / EDGE * MAX));
    }else if(ev.clientY > vh - EDGE){
      drag.dir = 1;
      drag.speed = Math.max(3, Math.round((ev.clientY - (vh - EDGE)) / EDGE * MAX));
    }else{
      drag.dir = 0;
    }
    if(!drag.raf){ drag.raf = requestAnimationFrame(autoScrollTick); }
  }

  function indexAt(y){
    var n = 0;
    for(var i = 0; i < listEl.children.length; i++){
      var el = listEl.children[i];
      if(el === drag.el) continue;
      var r = el.getBoundingClientRect();
      if(y > r.top + r.height / 2) n++;
    }
    return n;
  }

  function onUp(ev){
    if(!drag) return;
    var el = drag.el;
    var kids = Array.prototype.slice.call(listEl.children);
    var from = kids.indexOf(el);
    var to = indexAt(ev.clientY);

    if(drag.raf) cancelAnimationFrame(drag.raf);
    drag.ghost.remove();
    el.style.opacity = "";

    kids.splice(from, 1);
    listEl.insertBefore(el, to >= kids.length ? null : kids[to]);

    drag = null;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);

    var order = [];
    for(var i = 0; i < listEl.children.length; i++){
      var id = listEl.children[i].dataset.id;
      for(var k = 0; k < items.length; k++){ if(items[k].id === id){ order.push(items[k]); break; } }
    }
    if(order.length === items.length) items = order;
    renumber(); saveOrder(); toast("已记住这个顺序");
  }

  // 点缩略图看大图 + 写短评
  var lightItemId = null;
  listEl.addEventListener("click", function(ev){
    var img = ev.target.closest ? ev.target.closest(".thumb") : null;
    if(!img) return;
    var li = img.closest(".item");
    if(!li) return;
    var it = items.filter(function(x){ return x.id === li.dataset.id; })[0];
    if(!it) return;

  var cmpState = null;

  function setMode(mode){

  function startCompare(){
    if(items.length < 2){ toast("至少要有两项"); setMode("drag"); return; }
    cmpState = { i: 0, tiers: {}, history: [] };
    renderCompareCard();
  }

  function renderCompareCard(){
    if(!cmpState) return;
    if(cmpState.i >= items.length){ finishCompare(); return; }
    var it = items[cmpState.i];
    document.getElementById("imgA").src = it.src;
    document.getElementById("nameA").textContent = it.name;
    elProgress.textContent = "第 " + (cmpState.i + 1) + " / " + items.length +
      " 张 · 喜欢 " + countTier(1) + " · 一般 " + countTier(2) + " · 没感觉 " + countTier(3);
  }

  function countTier(t){
    var n = 0;
    for(var k in cmpState.tiers) if(cmpState.tiers[k] === t) n++;
    return n;
  }

  function assignTier(t){
    if(!cmpState) return;
    var it = items[cmpState.i];
    cmpState.history.push({ i: cmpState.i, id: it.id, prev: cmpState.tiers[it.id] });
    cmpState.tiers[it.id] = t;
    cmpState.i++;
    renderCompareCard();
  }

  function undoCompare(){
    if(!cmpState || !cmpState.history.length){ toast("已经是最开始那张了"); return; }
    var last = cmpState.history.pop();
    if(last.prev === undefined) delete cmpState.tiers[last.id];
    else cmpState.tiers[last.id] = last.prev;
    cmpState.i = last.i;
    renderCompareCard();
  }

  function finishCompare(){
    var base = items.slice();
    var tierOf = function(it){ return cmpState ? (cmpState.tiers[it.id] || 2) : 2; };
    var t = cmpState.tiers;
    items = base.slice().sort(function(a, b){
      var ta = t[a.id] || 2, tb = t[b.id] || 2;
      if(ta !== tb) return ta - tb;
      return base.indexOf(a) - base.indexOf(b);
    });
    cmpState = null;
    render(); saveOrder(); setMode("drag");
    window.scrollTo({ top: 0, behavior: "smooth" });

  /* ---------- 选冠军（单败淘汰）+ 赛程图 ---------- */
  var tour = null;
  var elTour = document.getElementById("tourPanel");

  function startTournament(){
    if(items.length < 4){ toast("至少四项才好比赛"); return; }
    var pool = items.slice().sort(function(){ return Math.random() - 0.5; });
    var size = Math.min(pool.length, 16);
    while(size & (size - 1)) size--;
    size = Math.max(4, size);
    var players = pool.slice(0, size);
    tour = {
      size: size,
      rounds: [],     // rounds[k] = [{a,b,w}]  (a/b = item id, w = id)
      list: players.slice(),
      next: [],
      idx: 0
    };
    // 建立第一轮
    var first = [];
    for(var i = 0; i < players.length; i += 2){
      first.push({ a: players[i].id, b: players[i + 1] ? players[i + 1].id : null, w: null });
    }
    tour.rounds.push(first);
    elTour.classList.add("show");
    listEl.style.display = "none";
    document.querySelector(".searchrow").style.display = "none";
    drawTourMatch();
  }

  function byId(id){ return items.filter(function(x){ return x.id === id; })[0]; }

  function curRound(){ return tour.rounds[tour.rounds.length - 1]; }
  function curMatchIndex(){ return curRound().findIndex(function(m){ return !m.w; }); }

  function roundName(n){
    if(n === 2) return "决赛";
    if(n === 4) return "半决赛";
    if(n === 8) return "八强";
    if(n === 16) return "十六强";
    return n + " 强";
  }

  function drawTourMatch(){
    if(!tour) return;
    var mi = curMatchIndex();
    if(mi < 0){
      // 本轮结束，生成下一轮
      var winners = curRound().map(function(m){ return m.w; });
      if(winners.length <= 1){ finishTournament(); return; }
      var nr = [];
      for(var i = 0; i < winners.length; i += 2){
        nr.push({ a: winners[i], b: winners[i + 1] || null, w: winners[i + 1] ? null : winners[i] });
      }
      tour.rounds.push(nr);
      drawTourMatch();
      return;
    }
    var m = curRound()[mi];
    var a = byId(m.a), b = byId(m.b);
    document.getElementById("tImgA").src = a.src;
    document.getElementById("tNameA").textContent = a.name;
    if(b){
      document.getElementById("tImgB").src = b.src;
      document.getElementById("tNameB").textContent = b.name;
      document.getElementById("tCardB").style.display = "";
    }else{
      document.getElementById("tCardB").style.display = "none";
    }
    document.getElementById("tourProgress").textContent =
      roundName(curRound().length * 2) + " · 第 " + (mi + 1) + " 场";
  }

  function pickTour(which){
    if(!tour) return;
    var mi = curMatchIndex();
    if(mi < 0) return;
    var m = curRound()[mi];
    m.w = (which === "a" || !m.b) ? m.a : m.b;
    drawTourMatch();
  }

  function skipTourMatch(){
    if(!tour) return;
    var mi = curMatchIndex();
    if(mi < 0) return;
    var m = curRound()[mi];
    m.w = (!m.b || Math.random() < 0.5) ? m.a : m.b;
    drawTourMatch();
  }

  function quitTournament(){
    tour = null;
    elTour.classList.remove("show");
    listEl.style.display = "";
    document.querySelector(".searchrow").style.display = "";
    setMode("drag");
  }

  function finishTournament(){
    var finalRound = tour.rounds[tour.rounds.length - 1];
    var champId = finalRound[0].w;
    var rounds = tour.rounds;
    quitTournament();
    drawBracket(rounds, champId);
  }

  /* 赛程图（canvas，左右对称，冠军居中） */
  function drawBracket(rounds, champId){
    var CARD_W = 230, CARD_H = 54, LEAF_GAP = 22, COL = 270, PAD = 28, HEAD = 104;
    var R = rounds.length;              // 轮数，例如 4（16→8→4→2）
    var n0 = rounds[0].length;          // 第一轮场次数，例如 8
    var half = n0 / 2;                  // 每边第一轮的场次数，例如 4
    var perSide = half * 2;             // 每边选手数，例如 8

    var H = HEAD + perSide * (CARD_H + LEAF_GAP) + PAD;
    var W = 2 * (PAD + (R - 1) * COL + CARD_W) + 40;
    var cxCenter = W / 2;

    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");

    // 每边第 k 轮的卡片 y 位置（左右各自独立，但同一套 y）
    var pos = [];
    pos[0] = [];
    for(var i = 0; i < half; i++){
      var top = HEAD + i * 2 * (CARD_H + LEAF_GAP);
      pos[0].push({ ya: top, yb: top + CARD_H + LEAF_GAP });
    }
    for(var k = 1; k < R - 1; k++){
      pos[k] = [];
      for(var j = 0; j < pos[k-1].length / 2; j++){
        var pa = pos[k-1][j*2], pb = pos[k-1][j*2+1];
        var y = pa ? (pb ? (pa.ya + pb.ya) / 2 : pa.ya) : 0;
        pos[k].push({ ya: y, yb: y });
      }
    }

    function xOfLeft(k){ return PAD + k * COL; }
    function xOfRight(k){ return W - PAD - CARD_W - k * COL; }

    var cache = {};
    function byId2(id){ return byId(id); }
    function preload(ids){
      return Promise.all(ids.map(function(id){
        return new Promise(function(res){
          var it = byId2(id);
          if(!it){ res(); return; }
          var im = new Image();
          im.onload = function(){ cache[id] = im; res(); };
          im.onerror = function(){ res(); };
          im.src = it.thumb || it.src;
        });
      }));
    }

    function rr(x, y, w, h, r){
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawCard(x, y, it, isChamp){
      ctx.save();
      rr(x, y, CARD_W, CARD_H, 10);
      ctx.fillStyle = isChamp ? "rgba(255,90,140,.22)" : "rgba(32,23,46,.94)";
      ctx.fill();
      ctx.strokeStyle = isChamp ? "#ff5a8c" : "rgba(180,140,255,.30)";
      ctx.lineWidth = isChamp ? 2.5 : 1;
      ctx.stroke();
      ctx.restore();

      var sq = CARD_H - 12, img = it ? cache[it.id] : null;
      ctx.save();
      rr(x + 6, y + 6, sq, sq, 6);
      ctx.clip();
      ctx.fillStyle = "#191022";
      ctx.fillRect(x + 6, y + 6, sq, sq);
      if(img && img.width){
        var sc = Math.max(sq / img.width, sq / img.height);
        var dw = img.width * sc, dh = img.height * sc;
        ctx.drawImage(img, x + 6 + (sq - dw)/2, y + 6 + (sq - dh)/2, dw, dh);
      }
      ctx.restore();

      ctx.textBaseline = "middle";
      ctx.fillStyle = isChamp ? "#fff" : "#efe6ff";
      ctx.font = (isChamp ? "bold 17px " : "16px ") + "-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      var label = it ? it.name : "—";
      var maxW = CARD_W - sq - 26;
      var t = label;
      while(ctx.measureText(t).width > maxW && t.length > 1) t = t.slice(0, -1);
      if(t !== label) t = t.slice(0, -1) + "…";
      ctx.fillText(t, x + 6 + sq + 10, y + CARD_H / 2);
    }

    function elb(x1, y1, x2, y2, color){
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      var mx = (x1 + x2) / 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(mx, y1); ctx.lineTo(mx, y2); ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    (async function(){
      var ids = [];
      rounds.forEach(function(rd){ rd.forEach(function(m){
        if(m.a) ids.push(m.a); if(m.b) ids.push(m.b);
      }); });
      await preload(ids);

      var bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0, "#1b1026"); bg.addColorStop(0.5, "#120a1a"); bg.addColorStop(1, "#0a0610");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      ctx.textAlign = "center";
      ctx.fillStyle = "#e6d2ff";
      ctx.font = "bold 36px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      ctx.fillText("战双剧情排行 · 冠军杯", cxCenter, 52);
      ctx.fillStyle = "#7d6a99";
      ctx.font = "15px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      ctx.fillText(perSide * 2 + " 强单败淘汰 · 冠军由你亲手选出", cxCenter, 82);
      ctx.textAlign = "left";

      // 左右第一轮：左用 0..half-1，右用 half..n0-1
      for(var k = 0; k < R - 1; k++){
        var cnt = pos[k] ? pos[k].length : 0;
        for(var j = 0; j < cnt; j++){
          var leftIdx = j;                       // 左侧第 j 场
          var rightIdx = cnt + j;                // 右侧对应场
          var mL = rounds[k][leftIdx], mR = rounds[k][rightIdx];
          // 左侧两卡
          if(mL){
            drawCard(xOfLeft(k), pos[k][j].ya, byId2(mL.a), false);
            if(mL.b) drawCard(xOfLeft(k), pos[k][j].yb, byId2(mL.b), false);
            if(mL.w && k + 1 < R - 1){
              var wy = (mL.w === mL.a ? pos[k][j].ya : pos[k][j].yb) + CARD_H/2;
              var py = pos[k+1][Math.floor(j/2)].ya + CARD_H/2;
              elb(xOfLeft(k) + CARD_W, wy, xOfLeft(k+1), py, "rgba(178,138,255,.35)");
            }
          }
          if(mR){
            drawCard(xOfRight(k), pos[k][j].ya, byId2(mR.a), false);
            if(mR.b) drawCard(xOfRight(k), pos[k][j].yb, byId2(mR.b), false);
            if(mR.w && k + 1 < R - 1){
              var wy2 = (mR.w === mR.a ? pos[k][j].ya : pos[k][j].yb) + CARD_H/2;
              var py2 = pos[k+1][Math.floor(j/2)].ya + CARD_H/2;
              elb(xOfRight(k), wy2, xOfRight(k+1) + CARD_W, py2, "rgba(178,138,255,.35)");
            }
          }
        }
      }

      // 半决赛 → 冠军（中线）
      var lastK = R - 2;
      if(pos[lastK]){
        var lw = rounds[lastK] && rounds[lastK][0];
        var rw = rounds[lastK] && rounds[lastK][pos[lastK].length];
        if(lw && lw.w) elb(xOfLeft(lastK) + CARD_W, pos[lastK][0].ya + CARD_H/2, cxCenter - CARD_W/2 - 40, H/2, "rgba(255,90,140,.6)");
        if(rw && rw.w) elb(xOfRight(lastK), pos[lastK][0].ya + CARD_H/2, cxCenter + CARD_W/2 + 40, H/2, "rgba(255,90,140,.6)");
      }

      // 冠军卡
      var champ = byId2(champId);
      var cw = CARD_W + 20, ch = CARD_H + 10;
      var cxp = cxCenter - cw/2, cyp = H/2 - ch/2;
      ctx.save();
      rr(cxp, cyp, cw, ch, 14);
      ctx.fillStyle = "rgba(255,90,140,.20)"; ctx.fill();
      ctx.strokeStyle = "#ff5a8c"; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffd76e";
      ctx.font = "bold 16px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      ctx.fillText("冠军", cxCenter, cyp - 14);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      var nm = champ ? champ.name : "—";
      while(ctx.measureText(nm).width > cw - 30 && nm.length > 1) nm = nm.slice(0, -1);
      ctx.fillText(nm, cxCenter, cyp + ch/2);
      ctx.textAlign = "left";

      var url = canvas.toDataURL("image/jpeg", 0.92);
      document.getElementById("bracketImg").src = url;
      document.getElementById("bracketSave").href = url;
      document.getElementById("bracketTitle").textContent = "赛程图 · 冠军：" + (champ ? champ.name : "—");
      var d = document.getElementById("bracketDlg");
      if(d.showModal) d.showModal(); else d.setAttribute("open","");
    })();
  }

  /* ---------- 导出长图 ---------- */
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function loadImg(src){
    return new Promise(function(resolve){
      var im = new Image();
      im.onload = function(){ resolve(im); };
      im.onerror = function(){ resolve(null); };
      im.src = src;
    });
  }

  function clipText(ctx, text, maxW){
    if(ctx.measureText(text).width <= maxW) return text;
    var t = text;
    while(t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }

  var imgBtn = document.getElementById("imgBtn");
  imgBtn.addEventListener("click", async function(){
    if(!items.length) return;
    var old = imgBtn.textContent;
    imgBtn.disabled = true; imgBtn.textContent = "生成中…";
    try{
      var imgs = await Promise.all(items.map(function(it){ return loadImg(it.src); }));

      var W = 760, PAD = 20, ROW = 108, HEAD = 156;
      var H = HEAD + items.length * ROW + PAD + 40;
      var c = document.createElement("canvas");
      c.width = W; c.height = H;
      var ctx = c.getContext("2d");

      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#161d28");
      bg.addColorStop(1, "#0a0c10");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.textBaseline = "middle";
      ctx.fillStyle = "#e9eef7";
      ctx.font = "bold 36px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      ctx.fillText("战双剧情排行", PAD + 4, 66);

      ctx.fillStyle = "#8b96a8";
      ctx.font = "16px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      var today = new Date();
      var dateStr = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
      ctx.fillText(dateStr + " · 共 " + items.length + " 项 · 由指挥官亲手排定", PAD + 6, 106);

      ctx.fillStyle = "#262c36";
      ctx.fillRect(PAD, HEAD - 26, W - PAD * 2, 1);

      var tw = 168, th = 94, tx = PAD + 58;
      for(var i = 0; i < items.length; i++){
        var y = HEAD + i * ROW;

        ctx.fillStyle = i < 3 ? "#ff5a6e" : "#6ad1ff";
        ctx.font = "bold 28px ui-monospace,Menlo,Consolas,monospace";
        ctx.textAlign = "right";
        ctx.fillText(String(i + 1), PAD + 44, y + ROW / 2);
        ctx.textAlign = "left";

        var ty = y + (ROW - th) / 2;
        ctx.save();
        roundRect(ctx, tx, ty, tw, th, 10);
        ctx.clip();
        ctx.fillStyle = "#000";
        ctx.fillRect(tx, ty, tw, th);
        var im = imgs[i];
        if(im && im.naturalWidth){
          var scale = Math.max(tw / im.naturalWidth, th / im.naturalHeight);
          var dw = im.naturalWidth * scale, dh = im.naturalHeight * scale;
          ctx.drawImage(im, tx + (tw - dw) / 2, ty + (th - dh) / 2, dw, dh);
        }else{
          ctx.fillStyle = "#2a303a";
          ctx.fillRect(tx, ty, tw, th);
        }
        ctx.restore();

        ctx.fillStyle = "#e9eef7";
        ctx.font = "20px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
        var name = clipText(ctx, items[i].name, W - tx - tw - PAD - 24);
        var cmt = comments[items[i].id];
        if(cmt){
          ctx.fillText(name, tx + tw + 16, y + ROW / 2 - 13);
          ctx.fillStyle = "#7cc4ff";
          ctx.font = "15px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
          ctx.fillText(clipText(ctx, "“" + cmt + "”", W - tx - tw - PAD - 24), tx + tw + 16, y + ROW / 2 + 18);
        }else{
          ctx.fillText(name, tx + tw + 16, y + ROW / 2);
        }

        if(i < items.length - 1){
          ctx.fillStyle = "rgba(255,255,255,.05)";
          ctx.fillRect(tx, y + ROW - 1, W - tx - PAD, 1);
        }
      }

      ctx.fillStyle = "#6b7686";
      ctx.font = "14px -apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif";
      ctx.fillText("图源：战双帕弥什 WIKI · 画册 / 登录界面", PAD + 6, H - 34);

      var dataUrl = c.toDataURL("image/jpeg", 0.92);
      var pv = document.getElementById("imgPreview");
      var sv = document.getElementById("imgSave");
      var ttl = document.getElementById("imgTitle");
      var dlg2 = document.getElementById("imgDlg");
      pv.src = dataUrl;
      sv.href = dataUrl;
      ttl.textContent = "长图已生成 · " + W + "×" + H;
      if(dlg2.showModal) dlg2.showModal(); else dlg2.setAttribute("open","");
      toast("长图已生成");
    }catch(e){
      toast("生成失败，换浏览器试试");
    }finally{
      imgBtn.disabled = false; imgBtn.textContent = old;
    }
  });

  document.getElementById("imgClose").addEventListener("click", function(){
    var d = document.getElementById("imgDlg");
    if(d.close) d.close(); else d.removeAttribute("open");
  });

  /* ---------- 启动 ---------- */
  fetch("data.json", { cache:"no-cache" })
    .then(function(r){ if(!r.ok) throw new Error("no data"); return r.json(); })
    .then(function(data){
      items = data;
      emptyEl.hidden = true;
      applySavedOrder();
      render();
    })
    .catch(function(){
      emptyEl.hidden = false;
      emptyEl.textContent = "读不到 data.json —— 请通过网址打开这个页面，别直接双击本地文件。";
    });
})();
</script>
</body>
</html>
